
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Sully Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a08;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;border-bottom:1px solid #39f20d;box-shadow:0 0 15px #39f20d44}
header h1{color:#39f20d;letter-spacing:3px}
main{padding:18px;max-width:800px;margin:auto}
h2{color:#39f20d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#101711;border:1px solid #39f20d;border-radius:15px;padding:14px;text-align:center;box-shadow:0 0 10px #39f20d22}
.pic{font-size:48px;padding:18px}
.price{color:#39f20d;font-weight:bold;font-size:20px}
button{background:#39f20d;border:0;border-radius:10px;padding:12px;font-weight:bold;width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:#101711;border-top:1px solid #39f20d;display:flex;justify-content:space-around;padding:14px 4px}
nav a{color:#39f20d;text-decoration:none;font-size:12px}
main{padding-bottom:90px}
</style>
</head>

</header>
